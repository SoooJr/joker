# Hexo Configuration
## 站点
title: Joker
subtitle: Just the way you are
description: SoooJr 的个人站点
keywords: joker, blog
author: SoooJr
language: zh-CN
timezone: Asia/Shanghai

## URL
## 重要：本站部署在 https://sooojr.github.io/joker/ 子路径下
## url + root 必须同时正确，否则生成的资源链接会全部 404
url: https://sooojr.github.io/joker
root: /joker/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

## 目录
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

## 写作
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude:
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

## 首页设置
index_generator:
  path: ''
  per_page: 10
  order_by: -date

## 分类 & 标签
default_category: uncategorized
category_map:
tag_map:

## 日期 / 时间格式
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

## 分页
per_page: 10
pagination_dir: page

## 扩展
theme: Mic_Theme

## 部署
## 用 GitHub Actions 自动构建，本地一般不需要手动 deploy
deploy:
  type: ''
